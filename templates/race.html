{% extends "base.html" %}
{% block content %}
<body data-car-color="{{ current_user.owned_cars[0].color if current_user.owned_cars else '#ff2e2e' }}">
    <div id="ui-overlay" style="position: absolute; top: 20px; left: 20px; color: white; z-index: 100; font-family: 'Orbitron';">
        <h2 id="speedometer">0 KM/H</h2>
        <p>Pilota: {{ current_user.username }}</p>
    </div>

    <div id="game-container" style="width: 100vw; height: 100vh; overflow: hidden;"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
    <script type="module" src="{{ url_for('static', filename='js/race.js') }}"></script>
</body>
{% endblock %}
