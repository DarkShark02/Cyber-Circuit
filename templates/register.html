{% extends "base.html" %}
{% block content %}
<div class="auth-container">
    <div class="glass-panel" style="width: 400px; text-align: center; border-color: #ff0055;">
        <h1 style="font-family: 'Orbitron'; color: #ff0055; margin-bottom: 10px; letter-spacing: 3px;">JOIN THE RACE</h1>
        <p style="opacity: 0.6; margin-bottom: 30px; text-transform: uppercase; font-size: 0.8em;">Create your profile and get your first car</p>

        <form method="POST" style="display: flex; flex-direction: column; gap: 15px;">
            <input type="text" name="username" placeholder="CHOOSE A USERNAME" required pattern="[A-Za-z0-9_]{3,20}" title="3-20 characters: letters, numbers or underscores" 
                   style="background: rgba(0,0,0,0.5); border: 1px solid #333; color: white; padding: 12px; border-radius: 5px; font-family: 'Rajdhani';">
            
            <input type="password" name="password" placeholder="CHOOSE A PASSWORD" required minlength="4" 
                   style="background: rgba(0,0,0,0.5); border: 1px solid #333; color: white; padding: 12px; border-radius: 5px; font-family: 'Rajdhani';">
            
            <button type="submit" class="btn" style="width: 100%; margin-top: 10px; background: linear-gradient(45deg, #ff0055, #8800ff);">CREATE ACCOUNT</button>
        </form>

        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 25px 0;">
        
        <p style="font-size: 0.9em;">
            Already have an account? 
            <a href="{{ url_for('login') }}" style="color: #ff0055; text-decoration: none; font-weight: bold;">LOG IN</a>
        </p>
    </div>
</div>
{% endblock %}
